<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABC Dental Clinic - Voice Receptionist</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web/dist/vapi.js"></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="logo-badge">ABC Dental</div>
      <h1>AI Dental Receptionist</h1>
      <p class="subtitle">Book appointments, ask about services, and get consultation details 24/7.</p>
    </header>

    <section class="card">
      <div class="status-indicator">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Ready to assist</span>
      </div>

      <div class="controls">
        <button id="call-btn" class="btn btn-primary" onclick="toggleCall()">
          <span id="btn-icon">🎙️</span>
          <span id="btn-label">Start Call</span>
        </button>
      </div>

      <div class="clinic-details">
        <h3>Clinic Information</h3>
        <ul>
          <li><strong>Consultation:</strong> ₹500</li>
          <li><strong>Hours:</strong> Mon – Sat: 9:00 AM – 7:00 PM (Closed Sun)</li>
          <li><strong>Location:</strong> Bengaluru, Karnataka</li>
        </ul>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
